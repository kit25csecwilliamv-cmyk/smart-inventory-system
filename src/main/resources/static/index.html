
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory & Billing</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h1>Smart Inventory & Billing</h1>
        <span>JAVA • SPRING BOOT</span>
    </header>

    <main>
        <section class="stats">
            <article>
                <small>Products in Stock</small>
                <strong id="units">0</strong>
            </article>
            <article>
                <small>Total Inventory Value</small>
                <strong id="value">₹0.00</strong>
            </article>
        </section>

        <section class="panel">
            <h2>Add Product</h2>
            <form id="productForm">
                <label>Product Name
                    <input id="name" required placeholder="LED Bulb">
                </label>
                <label>Category
                    <input id="category" placeholder="Electrical">
                </label>
                <label>Price (₹)
                    <input id="price" type="number" min="0.01"
                           step="0.01" required>
                </label>
                <label>Stock
                    <input id="stock" type="number" min="0"
                           step="1" required>
                </label>
                <button type="submit">Add Product</button>
            </form>
        </section>

        <section class="panel">
            <h2>Product Inventory</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="products"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
